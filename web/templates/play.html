<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani-CLI - Playing</title>
    <script type="module" src="{{ url_for('static', filename='upscaler.js') }}"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;1,500&display=swap");
        :root {
            --background-color: #1e1e1e;
            --primary-color: #ff5500;
            --secondary-color: #730000;

            --text-color: white;
            --second-text-color: black;
        }
        * {
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
            font-weight: 600;
            color: var(--text-color);
        }
        body {
            background-color: var(--background-color);
        }
        #container {
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #ep-container{
            display: flex;
            margin: 20px;
            flex-wrap: wrap;
        }
        .ep{
            margin: 0;
            background-color: var(--primary-color);
            cursor: pointer;
            transition: background-color 0.3s;
            border-radius: 10px;
            margin: 5px;
        }
        .ep a{
            text-decoration: none;
            display: block;
            padding: 20px;
        }
        .ep:hover{
            background-color: var(--secondary-color);
        }

        .active{
            background-color: var(--secondary-color);
        }

        .button {
            background-color: #ff5500;
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
            cursor: pointer;
        }

        video { width:50%; }

        form div, form div input, form div select, form div button {
            color: var(--second-text-color);
        }

        /* upscaler */
            .button label {
                font-weight: 600;
            }
            .button select {
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #333;
                background: var(--background-color);
                color: #eee;
                font-size: 14px;
                cursor: pointer;
            }
            .button select option {
                background: var(--background-color);
            }
            #playerWrap {
                position: relative;
                display: inline-block;
                background: #000;
                overflow: hidden;
                width: 50%;
            }
            #playerWrap canvas {
                display: block;
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
                background: #000;
                cursor: pointer;
            }
            #controlsBar {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.7);
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 12px;
                backdrop-filter: blur(4px);
                transition: opacity 0.3s;
            }
            #controlsBar button {
                background: none;
                border: none;
                color: #fff;
                font-size: 20px;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 4px;
                transition: background 0.2s;
            }
            #controlsBar button:hover {
                background: rgba(255,255,255,0.15);
            }
            #seekBar {
                flex: 1;
                height: 4px;
                -webkit-appearance: none;
                appearance: none;
                background: rgba(255,255,255,0.3);
                border-radius: 2px;
                cursor: pointer;
                min-width: 0;
            }
            #seekBar::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--primary-color);
                cursor: pointer;
            }
            #seekBar::-moz-range-thumb {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--primary-color);
                cursor: pointer;
                border: none;
            }
            #timeLabel {
                color: #fff;
                font-size: 13px;
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
                min-width: 100px;
            }
            #status {
                padding: 10px;
                background: rgba(233, 69, 96, 0.15);
                border-radius: 8px;
                margin: 12px 0;
                font-size: 14px;
            }
            #fastSeekIndicator {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 2rem;
                text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.3s;
            }
            @media (max-width: 600px) {
                #controlsBar button { font-size: 16px; padding: 2px 6px; }
                #timeLabel { font-size: 11px; min-width: 70px; }
            }

        @media (max-width: 1050px) {
            video {
                width: 80%;
            }
            .ep a {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="" id="indietro"><div class="button" style="position: fixed;">Indietro</div></a>
    <div id="container">
        <h2 style="margin: 40px;">{{ title }}</h2>

        <video controls style="aspect-ratio: 16/9;" id="mainVideo" autoplay playsinline crossorigin="anonymous"></video>

        <div id="playerWrap" style="display: none;">
            <!-- Canvas principale che mostra il video (upscalato o originale) -->
            <div id="fastSeekIndicator">+10</div>
            <canvas id="mainCanvas"></canvas>
            <div id="controlsBar">
                <button id="playPauseBtn" type="button">▶</button>
                <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
                <span id="timeLabel">00:00 / 00:00</span>
                <button id="fullscreenBtn" type="button">⛶</button>
            </div>
        </div>
        
        {% if ep | length != 1 %}
        <div id="ep-container">
            {% for episode, url in ep.items() %}
                <div class="ep {% if episode|int == current_ep|int %}active{% endif %}">
                   <a data-url="{{ url }}" data-ep="{{ episode }}" onclick="changeEp(this)">{{ episode }}</a>
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="button">
            <label>Upscaling</label>
            <select id="modeSelect">
                <option value="off" selected>Off</option>
                <option value="0">A</option>
                <option value="1">B (Consigliata)</option>
                <option value="2">C</option>
                <option value="3">AA</option>
                <option value="4">BB</option>
                <option value="5">CA</option>
            </select>
        </div>
        <div id="upscalerControlls" style="display: none;">
            <div class="button" id="risoluzioneBtn">
                <label>Risoluzione output</label>
                <select id="resolutionSelect">
                    <option value="originale">Originale</option>
                    <option value="1080p" selected>1080p (Consigliato)</option>
                    <option value="4k">4K</option>
                </select>
            </div>
            <div id="modeDesc"></div>
            <p id="status">🔄 Caricamento pipeline...</p>
        </div>
        <div class="button" onclick="toggleSkipIntro(); this.querySelector('input').checked = skip_intro">Skip Intro<input type="checkbox" style="margin-left: 5px;"></div><span id="skip_intro_data"></span>
        <form id="skipForm" style="display: none;">
            <div>
                <label for="skipType">Tipo Skip:</label>
                <select id="skipType" name="skip_type" required>
                <option value="op">Opening (OP)</option>
                <option value="ed">Ending (ED)</option>
                </select>
            </div>

            <div>
                <label for="startTime">Inizio (MM:SS):</label>
                <input 
                    type="text" 
                    id="startTime" 
                    name="start_time" 
                    pattern="^([0-9]{1,3}):([0-5][0-9])$" 
                    placeholder="05:34" 
                    required 
                />
            </div>

            <div>
                <label for="endTime">Fine (MM:SS):</label>
                <input 
                    type="text" 
                    id="endTime" 
                    name="end_time" 
                    pattern="^([0-9]{1,3}):([0-5][0-9])$" 
                    placeholder="07:02" 
                    required 
                />
            </div>

            <div>
                <label for="providerName">Provider:</label>
                <input type="text" id="providerName" name="provider_name" value="netflix" required />
            </div>

            <button type="submit">Invia Skip</button>
        </form>
        <div id="statusMessage"></div>

        <a href="" target="_blank" style="text-decoration: none;" id="down_vid"><div class="button">Scarica Video</div></a>
    </div>

    <script>
        let current_ep = "{{ current_ep }}";
        const ani_id = "{{ ani_id }}";
        let immagine = "{{ img }}";
        let title = "{{ title }}";

        // tasto indietro
        let indietro = document.getElementById('indietro');
        const q = localStorage.getItem("return");
        if (q) {
            indietro.href = "../?q=" + q;
        } else {
            indietro.href = "../";
        }

        // history
        function setCookie(nome, valore, giorni = 365) {
            const scadenza = new Date();
            scadenza.setTime(scadenza.getTime() + giorni * 24 * 60 * 60 * 1000);
            document.cookie = `${nome}=${encodeURIComponent(valore)}; expires=${scadenza.toUTCString()}; path=/`;
        }
        function getCookie(nome) {
            const match = document.cookie.match(new RegExp('(^| )' + nome + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }
        function addToHistory(item, maxItems = 20) {
            {% if VERCEL %}
            fetch('{{ url_for("ani_api.addHistory") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({item})
            }).then(response => {
                if (response.ok) return;
            });
            {% else %}
            let history = [];
            const raw = getCookie("history");

            if (raw) {
                try {
                    history = JSON.parse(raw);
                } catch (e) {
                    history = [];
                }
            }

            const title = item.title;
            const newEp = parseInt(item.ep);

            // cerca se esiste già una voce per questa serie
            const existingIndex = history.findIndex(h => h.title === title);

            if (existingIndex !== -1) {
                const existingEp = history[existingIndex].ep;

                // se il nuovo episodio non è più avanti di quello salvato, non fare nulla
                if (existingEp !== null && newEp !== null && newEp <= existingEp) {
                    return; // episodio uguale o precedente, ignora
                }

                // altrimenti rimuovi quella vecchia per sostituirla
                history.splice(existingIndex, 1);
            }

            // aggiunge la nuova voce (episodio più avanti, o serie nuova) in cima
            history.unshift(item);

            if (history.length > maxItems) {
                history = history.slice(0, maxItems);
            }

            setCookie("history", JSON.stringify(history));
            {% endif %}
        }
        
        const SOGLIA_SECONDI = 150; // 2:30 minuti
        let giaSalvato = false;
        const video = document.getElementById('mainVideo');
        video.addEventListener('timeupdate', function() {
            if (giaSalvato) return; // già salvato, non ricontrollare ad ogni tick

            if (video.currentTime >= SOGLIA_SECONDI) {
                giaSalvato = true;

                let url = window.location.href;
                url = url.split("play/").at(-1);
                let last = { "url": url, "title": title, "ep": current_ep, "img": immagine };
                console.log("Soglia raggiunta, salvo in history:", last);

                addToHistory(last);
            }
        });

        // resume
        let storageKey = `video-progress: ${title} - ${current_ep}`;

        // Ripristina la posizione salvata
        video.addEventListener('loadedmetadata', () => {
            const savedTime = localStorage.getItem(storageKey);
            if (savedTime) {
                video.currentTime = parseFloat(savedTime);
            }
        });
        // Salva la posizione periodicamente durante la riproduzione
        let lastSave = 0;
        video.addEventListener('timeupdate', () => {
            if (Math.abs(video.currentTime - lastSave) > 5) { // salva ogni 5 secondi
                localStorage.setItem(storageKey, video.currentTime);
                lastSave = video.currentTime;
            }
        });
        // Quando il video finisce, rimuovi il salvataggio
        video.addEventListener('ended', () => {
            localStorage.removeItem(storageKey);
        });

        async function getRealVideoUrl(epUrl) {
            const response = await fetch('../realUrl' + epUrl);
            const data = await response.json();
            // console.log("Video reale recuperato:", data.url);
            return data.url;
        }
        async function loadVideo(url) {
            const realUrl = await getRealVideoUrl(url);
            down_tasto.href = realUrl;
            video.src = realUrl;
            video.load();
        }

        // change ep
        let down_tasto = document.getElementById("down_vid");
        async function changeEp(element) {
            const epUrl = element.getAttribute('data-url');
            current_ep = element.getAttribute('data-ep');

            const url = new URL(window.location.href);
            url.searchParams.set("ep", current_ep); // Sostituisce o aggiunge "ep" in modo sicuro
            window.history.pushState({}, '', url); // cambia url senza reload
            
            document.querySelectorAll('div.active').forEach(el => {
                el.classList.remove('active');
            });
            element.parentElement.classList.add("active");

            storageKey = `video-progress: ${title} - ${current_ep}`;

            giaSalvato = false; // per history

            initSkipIntro(); // re-inizializza skip intro per il nuovo episodio

            loadVideo(epUrl);
            
            caricaImmagineInMediasession();
        }

        const episodi = {{ ep | tojson }};

        loadVideo(episodi["{{ current_ep }}"]);
        caricaImmagineInMediasession();

        // skip intro
        let skip_intro = localStorage.getItem("skip_intro") !== null ? localStorage.getItem("skip_intro") === "true" : false;
        const skip_intro_data_span = document.getElementById('skip_intro_data');
        let opInterval = null;
        let edInterval = null;
        document.querySelector('.button input').checked = skip_intro;
        function toggleSkipIntro() {
            skip_intro = !skip_intro;
            localStorage.setItem("skip_intro", skip_intro.toString());
            skip_intro_data_span.style.display = (skip_intro) ? 'block' : 'none';
        }
        function initSkipIntro() {
            skip_intro_data_span.style.display = (skip_intro) ? 'block' : 'none';
            document.getElementById('skipForm').style.display = 'none';
            const url_skip_intro = `https://api.aniskip.com/v1/skip-times/${ani_id}/${current_ep}?types=op&types=ed`;
            fetch(url_skip_intro)
                .then(response => response.json())
                .then(data => {
                    if (data && data.found && Array.isArray(data.results)) {
                        const op = data.results.find(item => item.skip_type === 'op');
                        const ed = data.results.find(item => item.skip_type === 'ed');

                        // Estrai gli intervalli
                        opInterval = op ? [op.interval.start_time, op.interval.end_time] : null;
                        edInterval = ed ? [ed.interval.start_time, ed.interval.end_time] : null;

                        // Aggiungi 5 secondi all'inizio e sottrai 5 secondi alla fine
                        opInterval = [opInterval[0] + 5, opInterval[1] - 10]; 
                        edInterval = [edInterval[0] + 5, edInterval[1] - 5];

                        const opStartMin = `${Math.floor(opInterval[0] / 60)}:${Math.floor(opInterval[0] % 60).toString().padStart(2, '0')}`;
                        const opEndMin = `${Math.floor(opInterval[1] / 60)}:${Math.floor(opInterval[1] % 60).toString().padStart(2, '0')}`;
                        console.log(`OP: da ${opStartMin} a ${opEndMin}`);
                        skip_intro_data_span.textContent = `${opStartMin}, ${opEndMin};`;
                        
                        const edStartMin = `${Math.floor(edInterval[0] / 60)}:${Math.floor(edInterval[0] % 60).toString().padStart(2, '0')}`;
                        const edEndMin = `${Math.floor(edInterval[1] / 60)}:${Math.floor(edInterval[1] % 60).toString().padStart(2, '0')}`;
                        console.log(`ED: da ${edStartMin} a ${edEndMin}`);
                        skip_intro_data_span.textContent += ` ${edStartMin}, ${edEndMin}`;
                    } else {
                        console.warn('Intro skipper: no data found');
                        skip_intro_data_span.textContent = `Intro non trovata`;
                        opInterval = null;
                        edInterval = null;
                        document.getElementById('skipForm').style.display = 'block';
                    }
                })
                .catch(error => console.error('Errore nel recupero dei dati di skip:', error));
        }
        initSkipIntro();
        video.addEventListener('timeupdate', () => {
            if (!skip_intro) return; // se skip_intro è disattivato, non fare nulla
            if (opInterval && video.currentTime >= opInterval[0] && video.currentTime <= opInterval[1]) {
                video.currentTime = opInterval[1];
            }
            if (edInterval && video.currentTime >= edInterval[0] && video.currentTime <= edInterval[1]) {
                video.currentTime = edInterval[1];
            }
        });

        function timeToSeconds(timeStr) {
            const parts = timeStr.trim().split(':').map(Number);
            if (parts.length === 2) {
                const [minutes, seconds] = parts;
                return minutes * 60 + seconds;
            } else if (parts.length === 3) {
                const [hours, minutes, seconds] = parts;
                return hours * 3600 + minutes * 60 + seconds;
            }
            return parseFloat(timeStr) || 0;
        }
        // sendSkipIntro
            document.getElementById('skipForm').addEventListener('submit', async function(event) {
                event.preventDefault();

                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = 'Invio in corso...';

                // Recupera o genera l'UUID submitter
                let submitterId = localStorage.getItem('aniskip_submitter_id');
                if (!submitterId) {
                    submitterId = crypto.randomUUID();
                    localStorage.setItem('aniskip_submitter_id', submitterId);
                }

                // Converte i tempi "MM:SS" immessi dall'utente in secondi numerici per l'API
                const startTimeSec = timeToSeconds(document.getElementById('startTime').value);
                const endTimeSec = timeToSeconds(document.getElementById('endTime').value);
                
                epLengthSec = video.duration;

                const payload = {
                    skip_type: document.getElementById('skipType').value,
                    provider_name: document.getElementById('providerName').value,
                    start_time: startTimeSec,
                    end_time: endTimeSec,
                    episode_length: epLengthSec,
                    submitter_id: submitterId
                };

                const url = `https://api.aniskip.com/v1/skip-times/${ani_id}/${current_ep}`;

                try {
                    const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (response.ok) {
                    statusDiv.textContent = 'Skip inviato con successo!';
                    } else {
                    statusDiv.textContent = 'Errore: ' + JSON.stringify(data.message || data);
                    }
                } catch (err) {
                    statusDiv.textContent = 'Errore di rete durante l\'invio.';
                    console.error(err);
                }
            });

        // immagine
        function caricaImmagineInMediasession() {
            if (!('mediaSession' in navigator)) return; // not in
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artwork: [{
                    src: immagine,
                    sizes: "512x512",
                    type: "image/jpeg"
                }]
            });
        }
    </script>
</body>
</html>
