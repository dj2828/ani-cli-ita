<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani-CLI</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body{
            overflow: hidden;
        }
        #container {
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #ep-container{
            display: flex;
            margin: 20px;
            border-radius: 20px;
            overflow: hidden;
            flex-wrap: wrap;
        }
        .ep{
            margin: 0;
            background-color: var(--primary-color);
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .ep a{
            text-decoration: none;
            display: block;
            padding: 20px;
        }
        .ep:hover{
            background-color: var(--secondary-color);
        }

        .active{
            background-color: var(--secondary-color);
        }

        .button {
            background-color: #ff5500;
            padding: 10px;
            border-radius: 10px;
            position: fixed;
            margin: 10px;
            cursor: pointer;
        }

        video { width:50%; }

        @media (max-width: 1050px) {
            video {
                width: 80%;
            }
            .ep a {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="button" onclick="location.href=this.ritorna" id="indietro">Indietro</div>
    <div id="container">
        <video controls style="aspect-ratio: 16/9;">
            <source src="{{ video_url }}" type="video/mp4">
        </video>
        
        <div id="ep-container">
            {% for episode_title, url in ep.items() %}
                <div class="ep{% if episode_title == current_ep %} active{% endif %}">
                    <a href="{{ url }}?ep={{ episode_title }}">{{ episode_title }}</a>
                </div>
            {% endfor %}
        </div>
    </div>

    <script>
        let indietro = document.getElementById('indietro');
        const q = localStorage.getItem("return");

        if (q) {
            indietro.ritorna = "../../?q=" + q;
        } else {
            indietro.ritorna = "../../"
        }
    </script>
</body>
</html>
